    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {

    max-width: 100%;

  }

  .form-check {

    padding-inline: 15px;
  }

  .form-check-input {

  }

  .form-check-input::after {

    left: 50%;
    width: 44px;
    height: 44px;

  }

  .form-check-label {
    display: inline-flex;

  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  const stringify = JSON.stringify;
  const parse = JSON.parse;

  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

   * @param {string} property

  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const postToHost = (type, payload) =&gt; {

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

      }

    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

  syncTheme();
})();

    &lt;div class=&quot;progress&quot; id=&quot;cw-progress&quot; role=&quot;progressbar&quot; aria-label=&quot;Letters transformed&quot; aria-valuenow=&quot;0&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;12&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;cw-progress-bar&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;cw-status-row text-small&quot;&gt;&lt;span id=&quot;cw-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;Ready · letter 1 of 12&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;Spaces and punctuation keep their places; the key advances on A–Z only.&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      &#x27;use strict&#x27;;
      const root = document.getElementById(&#x27;cipher-wheel-demo&#x27;);
      const $ = id =&gt; root.querySelector(&#x27;#cw-&#x27; + id);
      const alphabet = &#x27;ABCDEFGHIJKLMNOPQRSTUVWXYZ&#x27;;
      const unit = 360 / 26;
      const mod = n =&gt; ((n % 26) + 26) % 26;
      const svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
      const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const state = { mode: &#x27;fixed&#x27;, direction: &#x27;encode&#x27;, shift: 3, key: &#x27;LEMON&#x27;, valid: true, records: [], letters: [], done: 0, playing: false, busy: false, token: 0, angle: -3 * unit, phase: &#x27;ready&#x27;, current: null, size: 0, geometry: null };
      let innerGroup, innerCells = [], outerCells = [], innerText = [], outerText = [], connector;
      for (let i = 0; i &lt; 26; i++) {
        const option = document.createElement(&#x27;option&#x27;);
        option.value = i;
        option.textContent = alphabet[i] + &#x27; · shift &#x27; + i + &#x27; (A → &#x27; + alphabet[i] + &#x27;)&#x27;;
        $(&#x27;shift&#x27;).append(option);
      }
      $(&#x27;shift&#x27;).value = &#x27;3&#x27;;

      function svg(tag, attributes, parent) {
        const element = document.createElementNS(svgNS, tag);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
        if (parent) parent.append(element);
        return element;
      }
      function point(radius, degrees) {
        const a = degrees * Math.PI / 180;
        const c = state.size / 2;
        return [c + radius * Math.sin(a), c - radius * Math.cos(a)];
      }
      function sector(inner, outer, degrees) {
        const p = point(outer, degrees - unit / 2 + 0.65);
        const q = point(outer, degrees + unit / 2 - 0.65);
        const r = point(inner, degrees + unit / 2 - 0.65);
        const s = point(inner, degrees - unit / 2 + 0.65);
        return `M${p} A${outer},${outer} 0 0 1 ${q} L${r} A${inner},${inner} 0 0 0 ${s} Z`;
      }
      function buildWheel() {
        const width = Math.floor($(&#x27;wheel-wrap&#x27;).getBoundingClientRect().width);
        if (width &lt; 1 || width === state.size) return;
        state.size = width;
        const c = width / 2;
        const r = c - 9;
        const gap = Math.min(45, width * 0.116);
        state.geometry = { r, plain: r - 22, cipher: r - 22 - gap, gap };
        const g = state.geometry;
        $(&#x27;wheel&#x27;).setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${width}`);
        const drawing = $(&#x27;drawing&#x27;);
        drawing.replaceChildren();
        // Separate cast-metal plates, with lighting fixed to the room as the inner one turns.
        svg(&#x27;ellipse&#x27;, { cx: c, cy: c + 6, rx: r - 2, ry: r - 1, fill: &#x27;#2d2014&#x27;, opacity: 0.18 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c + 3, r, fill: &#x27;#614321&#x27;, stroke: &#x27;#392713&#x27;, &#x27;stroke-width&#x27;: 1 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r, fill: &#x27;url(#cw-bronze-rim)&#x27;, stroke: &#x27;#735331&#x27;, &#x27;stroke-width&#x27;: 1 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: r - 5, fill: &#x27;url(#cw-bronze-outer)&#x27;, stroke: &#x27;#e2c18a&#x27;, &#x27;stroke-width&#x27;: 1.1 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: r - 8, fill: &#x27;none&#x27;, stroke: &#x27;#775129&#x27;, &#x27;stroke-width&#x27;: 0.8 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: r - 9.3, fill: &#x27;none&#x27;, stroke: &#x27;#e5c58d&#x27;, &#x27;stroke-width&#x27;: 0.6, opacity: 0.8 }, drawing);
        // Small irregular pits and rubbed edges make the metal read as an old instrument.
        const wear = (parent, radius, count, seed, inner = 0) =&gt; {
          const hash = n =&gt; { const x = Math.sin(n * 12.9898 + seed * 78.233) * 43758.5453; return x - Math.floor(x); };
          for (let j = 0; j &lt; count; j++) {
            const a = hash(j + 1) * 360;
            const distance = inner + (radius - inner) * hash(j + 31);
            const p = point(distance, a);
            svg(&#x27;ellipse&#x27;, { cx: p[0], cy: p[1], rx: 0.25 + hash(j + 71) * 1.05, ry: 0.18 + hash(j + 91) * 0.5, fill: j % 5 === 0 ? &#x27;#475c44&#x27; : &#x27;#624521&#x27;, opacity: 0.08 + hash(j + 53) * 0.2 }, parent);
          }
          for (let j = 0; j &lt; 18; j++) {
            const rr = inner + (radius - inner) * hash(j + 153);
            const angle = hash(j + 177) * 360;
            const p = point(rr, angle), q = point(rr, angle + 5 + hash(j + 194) * 16);
            svg(&#x27;path&#x27;, { d: `M${p} A${rr},${rr} 0 0 1 ${q}`, fill: &#x27;none&#x27;, stroke: j % 2 ? &#x27;#f0d89f&#x27; : &#x27;#64421f&#x27;, &#x27;stroke-width&#x27;: 0.45, opacity: 0.25 }, parent);
          }
        };
        wear(drawing, r - 7, 130, 4, g.cipher + 23);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: r - 6, fill: &#x27;#8f6935&#x27;, filter: &#x27;url(#cw-bronze-grain)&#x27;, opacity: 0.11 }, drawing);
        for (let i = 0; i &lt; 104; i++) {
          const a = i * unit / 4;
          const p = point(r - 1.5, a), q = point(r - (i % 4 ? 4.2 : 6.1), a);
          svg(&#x27;line&#x27;, { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: i % 2 ? &#x27;#e6c28a&#x27; : &#x27;#624120&#x27;, &#x27;stroke-width&#x27;: 0.7, opacity: 0.6 }, drawing);
        }
        outerCells = []; outerText = []; innerCells = []; innerText = [];
        for (let i = 0; i &lt; 26; i++) {
          const cell = svg(&#x27;path&#x27;, { d: sector(g.plain - 13, g.plain + 12, i * unit), fill: &#x27;transparent&#x27; }, drawing);
          outerCells.push(cell);
          const p = point(g.plain, i * unit);
          const t = svg(&#x27;text&#x27;, { x: p[0], y: p[1] }, drawing);
          t.textContent = alphabet[i]; outerText.push(t);
          const p1 = point(g.plain - 10, (i + 0.5) * unit), p2 = point(g.plain + 10, (i + 0.5) * unit);
          svg(&#x27;line&#x27;, { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: &#x27;#6d4c28&#x27;, &#x27;stroke-width&#x27;: 0.65, opacity: 0.38 }, drawing);
        }
        svg(&#x27;circle&#x27;, { cx: c, cy: c + 2, r: g.cipher + 21, fill: &#x27;#593d20&#x27;, opacity: 0.9 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: g.cipher + 20, fill: &#x27;url(#cw-bronze-rim)&#x27;, stroke: &#x27;#6c4b26&#x27;, &#x27;stroke-width&#x27;: 1 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: g.cipher + 16, fill: &#x27;url(#cw-bronze-inner)&#x27;, stroke: &#x27;#ead19b&#x27;, &#x27;stroke-width&#x27;: 0.9 }, drawing);
        innerGroup = svg(&#x27;g&#x27;, {}, drawing);
        wear(innerGroup, g.cipher + 13, 85, 9, g.cipher - 13);
        for (let i = 0; i &lt; 26; i++) {
          const p = point(g.cipher + 14, (i + 0.5) * unit), q = point(g.cipher - 12, (i + 0.5) * unit);
          svg(&#x27;line&#x27;, { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: &#x27;#6b4a25&#x27;, &#x27;stroke-width&#x27;: 0.65, opacity: 0.45 }, innerGroup);
        }
        for (let i = 0; i &lt; 26; i++) {
          innerCells.push(svg(&#x27;path&#x27;, { d: sector(g.cipher - 12, g.cipher + 12, i * unit), fill: &#x27;transparent&#x27; }, innerGroup));
          const p = point(g.cipher, i * unit);
          const t = svg(&#x27;text&#x27;, { x: p[0], y: p[1] }, innerGroup);
          t.textContent = alphabet[i]; innerText.push({ element: t, x: p[0], y: p[1] });
        }
        const hub = g.cipher - 19;
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: hub + 3, fill: &#x27;#70502a&#x27;, stroke: &#x27;#ecd198&#x27;, &#x27;stroke-width&#x27;: 1 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: hub, fill: &#x27;url(#cw-bronze-hub)&#x27;, stroke: &#x27;#4c341c&#x27;, &#x27;stroke-width&#x27;: 0.8 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: hub - 3, fill: &#x27;none&#x27;, stroke: &#x27;#e2c18b&#x27;, &#x27;stroke-width&#x27;: 0.75, opacity: 0.8 }, drawing);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: hub - 6, fill: &#x27;none&#x27;, stroke: &#x27;#7a5930&#x27;, &#x27;stroke-width&#x27;: 0.55, opacity: 0.6 }, drawing);
        wear(drawing, hub - 8, 75, 14, 0);
        svg(&#x27;circle&#x27;, { cx: c, cy: c, r: hub - 1, fill: &#x27;#8f6935&#x27;, filter: &#x27;url(#cw-bronze-grain)&#x27;, opacity: 0.08 }, drawing);
        for (const a of [0, 90, 180, 270]) {
          const p = point(hub - 12, a);
          svg(&#x27;circle&#x27;, { cx: p[0], cy: p[1] + 0.7, r: 3.9, fill: &#x27;#6b4825&#x27;, opacity: 0.65 }, drawing);
          svg(&#x27;circle&#x27;, { cx: p[0], cy: p[1], r: 3.2, fill: &#x27;url(#cw-bronze-bolt)&#x27;, stroke: &#x27;#75532c&#x27;, &#x27;stroke-width&#x27;: 0.55 }, drawing);
          svg(&#x27;line&#x27;, { x1: p[0] - 1.8, y1: p[1] + 1, x2: p[0] + 1.8, y2: p[1] - 1, stroke: &#x27;#63451f&#x27;, &#x27;stroke-width&#x27;: 0.9 }, drawing);
        }
        connector = svg(&#x27;line&#x27;, { stroke: &#x27;#422d17&#x27;, &#x27;stroke-width&#x27;: 2, &#x27;marker-end&#x27;: &#x27;url(#cw-arrow)&#x27;, opacity: 0 }, drawing);
        applyAngle();
        highlight();
      }
      function applyAngle() {
        if (!innerGroup) return;
        const c = state.size / 2;
        innerGroup.setAttribute(&#x27;transform&#x27;, `rotate(${state.angle} ${c} ${c})`);
        for (const t of innerText) t.element.setAttribute(&#x27;transform&#x27;, `rotate(${-state.angle} ${t.x} ${t.y})`);
      }
      function activeRecord() {
        if (state.phase === &#x27;reveal&#x27; || state.phase === &#x27;complete&#x27; || (state.done &gt; 0 &amp;&amp; state.done === state.letters.length)) return state.current;
        return state.letters[state.done] || null;
      }
      function activeShift() {
        const active = activeRecord();
        if (active) return active.shift;
        return state.mode === &#x27;fixed&#x27; ? state.shift : alphabet.indexOf(state.key[0] || &#x27;A&#x27;);
      }
      function highlight() {
        if (!outerCells.length) return;
        const record = activeRecord();
        const visible = state.valid &amp;&amp; record &amp;&amp; state.phase !== &#x27;turn&#x27;;
        const revealed = state.phase === &#x27;reveal&#x27; || state.phase === &#x27;complete&#x27;;
        const plainOn = visible &amp;&amp; (revealed || state.direction === &#x27;encode&#x27;) ? record.plain : -1;
        const cipherOn = visible &amp;&amp; (revealed || state.direction === &#x27;decode&#x27;) ? record.cipher : -1;
        for (let i = 0; i &lt; 26; i++) {
          outerCells[i].setAttribute(&#x27;fill&#x27;, i === plainOn ? &#x27;#f1d59b&#x27; : &#x27;transparent&#x27;);
          innerCells[i].setAttribute(&#x27;fill&#x27;, i === cipherOn ? &#x27;#f1d59b&#x27; : &#x27;transparent&#x27;);
          outerCells[i].setAttribute(&#x27;stroke&#x27;, i === plainOn ? &#x27;#785323&#x27; : &#x27;none&#x27;);
